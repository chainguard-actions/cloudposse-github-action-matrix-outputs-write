name: Test invalid YAML outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          outputs: |-
            foo: [unclosed
            bar: : baz
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"; echo "result: $RESULT"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ -z "$RESULT" ] || { echo "FAIL: result should not be set"; exit 1; }
          echo "PASS"
