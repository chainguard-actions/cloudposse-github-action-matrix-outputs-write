name: Test nested YAML outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          outputs: |-
            config:
              name: app
              replicas: 3
            list:
              - a
              - b
      - name: Assert outputs
        env:
          CONFIG: ${{ steps.action.outputs.config }}
          LIST: ${{ steps.action.outputs.list }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "config: $CONFIG"
          echo "list: $LIST"
          echo "result: $RESULT"
          if [ "$CONFIG" != '{"name":"app","replicas":3}' ]; then echo "FAIL: config"; exit 1; fi
          if [ "$LIST" != '["a","b"]' ]; then echo "FAIL: list"; exit 1; fi
          if [ "$RESULT" != '{"config":{"name":"app","replicas":3},"list":["a","b"]}' ]; then echo "FAIL: result"; exit 1; fi
          echo "PASS"
