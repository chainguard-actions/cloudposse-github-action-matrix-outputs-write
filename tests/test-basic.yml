name: Test basic outputs (no matrix)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          outputs: |-
            image: nginx
            tag: latest
      - name: Assert outputs
        env:
          IMAGE: ${{ steps.action.outputs.image }}
          TAG: ${{ steps.action.outputs.tag }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "image: $IMAGE"
          echo "tag: $TAG"
          echo "result: $RESULT"
          if [ "$IMAGE" != "nginx" ]; then echo "FAIL: image"; exit 1; fi
          if [ "$TAG" != "latest" ]; then echo "FAIL: tag"; exit 1; fi
          if [ "$RESULT" != '{"image":"nginx","tag":"latest"}' ]; then echo "FAIL: result"; exit 1; fi
          echo "PASS"
